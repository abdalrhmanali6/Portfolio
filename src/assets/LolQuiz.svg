<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d18" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89b3c" />
      <stop offset="50%" stop-color="#f0be5a" />
      <stop offset="100%" stop-color="#c89b3c" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89b3c" />
      <stop offset="100%" stop-color="#785a28" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background with Hextech Glow -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <circle cx="600" cy="337" r="350" fill="#0a3c5a" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="337" r="200" fill="#c89b3c" opacity="0.05" filter="url(#glow)" />

  <!-- Header -->
  <text x="40" y="50" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#c89b3c" letter-spacing="2">LEAGUE OF LEGENDS</text>
  <text x="750" y="45" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="url(#goldGrad)" letter-spacing="3">RUNETERRA CHALLENGE</text>
  <text x="890" y="70" font-family="Georgia, serif" font-size="14" fill="#a0b9cd">Prove your mastery of the Rift.</text>

  <!-- Progress Bar Info -->
  <text x="40" y="125" font-family="monospace" font-size="14" font-weight="bold" fill="#00d2d2">QUESTION 1 OF 50</text>
  <text x="1050" y="125" font-family="monospace" font-size="14" font-weight="bold" fill="#00d2d2">0% COMPLETE</text>

  <!-- Progress Bar track & fill -->
  <rect x="40" y="138" width="1120" height="8" rx="4" fill="#142030" />
  <rect x="40" y="138" width="60" height="8" rx="4" fill="#00d2d2" />

  <!-- Question Card Container -->
  <rect x="40" y="170" width="1120" height="455" rx="12" fill="#0a1424" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.95" />

  <!-- Difficulty Badge -->
  <rect x="500" y="200" width="200" height="32" rx="16" fill="#0c2826" stroke="#00c8a0" stroke-width="1" />
  <circle cx="522" cy="216" r="5" fill="#00e6a0" />
  <text x="536" y="221" font-family="monospace" font-size="12" font-weight="bold" fill="#00e6a0" letter-spacing="1">EASY • RECRUIT</text>

  <!-- Question Title -->
  <text x="600" y="275" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#f5ebd2" text-anchor="middle">WHICH CHAMPION SAYS: 'HAVE YOU SEEN MY BEAR TIBBERS?'</text>

  <!-- Answer Options Grid (2x2) -->
  <!-- Option A -->
  <rect x="80" y="330" width="500" height="70" rx="8" fill="#0f233a" stroke="#00d2e6" stroke-width="1.5" />
  <text x="110" y="372" font-family="sans-serif" font-size="18" font-weight="bold" fill="#00d2e6">A.</text>
  <text x="145" y="372" font-family="sans-serif" font-size="18" fill="#dcebf5">Annie</text>

  <!-- Option B -->
  <rect x="620" y="330" width="500" height="70" rx="8" fill="#0c1a2e" stroke="#1e3755" stroke-width="1" />
  <text x="650" y="372" font-family="sans-serif" font-size="18" font-weight="bold" fill="#00d2e6">B.</text>
  <text x="685" y="372" font-family="sans-serif" font-size="18" fill="#dcebf5">Zoe</text>

  <!-- Option C -->
  <rect x="80" y="420" width="500" height="70" rx="8" fill="#0c1a2e" stroke="#1e3755" stroke-width="1" />
  <text x="110" y="462" font-family="sans-serif" font-size="18" font-weight="bold" fill="#00d2e6">C.</text>
  <text x="145" y="462" font-family="sans-serif" font-size="18" fill="#dcebf5">Lulu</text>

  <!-- Option D -->
  <rect x="620" y="420" width="500" height="70" rx="8" fill="#0c1a2e" stroke="#1e3755" stroke-width="1" />
  <text x="650" y="462" font-family="sans-serif" font-size="18" font-weight="bold" fill="#00d2e6">D.</text>
  <text x="685" y="462" font-family="sans-serif" font-size="18" fill="#dcebf5">Nunu &amp; Willump</text>

  <!-- Next Question Button -->
  <rect x="500" y="520" width="200" height="45" rx="6" fill="url(#btnGrad)" stroke="url(#goldGrad)" stroke-width="1" />
  <text x="600" y="548" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0a1424" text-anchor="middle" letter-spacing="1">NEXT QUESTION →</text>
</svg>
